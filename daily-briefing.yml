name: Daily News Push

on:
  schedule:
    - cron: '5 0 * * *'        # 北京时间 08:05（GitHub cron 为 UTC，00:05）
  workflow_dispatch: {}        # 允许在 Actions 页面手动点 Run 测试

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run
        env:
          TIAN_API_KEY: ${{ secrets.TIAN_API_KEY }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python scripts/push_briefing.py
